name: Build deb packages

on:
  push:

jobs:

  get_version:
    name: 'Set Release Version'
    runs-on: ubuntu-latest
    container:
      image: openroad/ubuntu22.04-dev
    outputs:
      date: ${{ steps.set_version.outputs.date }}
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set release version
        id: set_version
        run: |
          git config --global --add safe.directory '*'
          echo "version=$(git describe | sed 's/v//')" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

  builder:
    name: 'Build .deb package'
    needs: get_version
    strategy:
      fail-fast: false
      matrix:
        os: ['debian11', 'ubuntu20.04', 'ubuntu22.04']
    runs-on: ubuntu-latest
    container:
      image: openroad/${{ matrix.os }}-dev

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set safe directory
        run: |
          git config --global --add safe.directory '*'

      - name: Build package
        run: |
          ./debian/create-changelog.sh ${{ needs.get_version.outputs.version }}
          debuild --preserve-env --preserve-envvar=PATH -B
          # move files because upload-artifacts do not allow relative paths
          mv ../openroad*.deb .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openroad_${{ needs.get_version.outputs.version }}_${{ matrix.os }}_amd64.deb
          path: openroad_${{ needs.get_version.outputs.version }}_amd64.deb

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [get_version, builder]
    container:
      image: openroad/ubuntu22.04-dev
    steps:
      - uses: actions/checkout@v4

      - name: Set safe directory
        run: |
          git config --global --add safe.directory '*'

      - name: Create release if not exists
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.get_version.outputs.version }}
          release_name: ${{ needs.get_version.outputs.version }}
          body: |
            "Release ${{ needs.get_version.outputs.version }} on ${{ needs.get_version.outputs.date }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Upload debian11 Release Asset
        id: upload-release-asset-debian11
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/openroad_${{ needs.get_version.outputs.version }}_debian11_amd64.deb
          asset_name: openroad_${{ needs.get_version.outputs.version }}_debian11_amd64.deb
          asset_content_type: application/octet-stream

      - name: Upload ubuntu20.04 Release Asset
        id: upload-release-asset-ubuntu20
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/openroad_${{ needs.get_version.outputs.version }}_ubuntu20.04_amd64.deb
          asset_name: openroad_${{ needs.get_version.outputs.version }}_ubuntu20.04_amd64.deb
          asset_content_type: application/octet-stream

      - name: Upload ubuntu22.04 Release Asset
        id: upload-release-asset-ubuntu22
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/openroad_${{ needs.get_version.outputs.version }}_ubuntu22.04_amd64.deb
          asset_name: openroad_${{ needs.get_version.outputs.version }}_ubuntu22.04_amd64.deb
          asset_content_type: application/octet-stream
